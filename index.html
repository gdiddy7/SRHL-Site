<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SR Hockey Stats</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ice:#eef3f6;--card:#fff;--navy:#14213d;--red:#c8102e;--steel:#5d6d80;--line:#d3dde5}
@media(prefers-color-scheme:dark){:root{--ice:#0e1524;--card:#16203a;--navy:#e8eef5;--steel:#96a5b8;--line:#2a3856}}
*{box-sizing:border-box}
body{margin:0;background:var(--ice);color:var(--navy);font:16px/1.5 Barlow,system-ui,sans-serif}
header,main{max-width:900px;margin:auto;padding:0 16px}
header{padding-top:26px}
h1{font:700 44px/1 "Barlow Condensed",Impact,sans-serif;margin:0;text-transform:uppercase}
h1 i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--red);margin-left:8px}
nav{display:flex;gap:4px;margin-top:16px;border-bottom:2px solid var(--line);overflow-x:auto;align-items:center}
nav button,nav select{background:none;border:0;padding:10px 14px;font:600 18px "Barlow Condensed",sans-serif;color:var(--steel);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
nav [aria-selected=true]{color:var(--navy);border-color:var(--red)}
nav select{background:var(--ice)}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:16px 0 10px;color:var(--steel);font-size:14px}
.bar button{font:600 15px "Barlow Condensed",sans-serif;padding:6px 12px;border:1px solid var(--line);background:var(--card);color:var(--navy);border-radius:4px;cursor:pointer}
.wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:6px;margin-bottom:40px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:10px 12px;text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card)}
th{font:600 15px "Barlow Condensed",sans-serif;color:var(--steel);border-bottom:2px solid var(--navy);cursor:pointer;user-select:none}
th[aria-sort]{color:var(--navy)}
th[aria-sort=descending]::after{content:" ▼";font-size:10px}
th[aria-sort=ascending]::after{content:" ▲";font-size:10px}
td{border-bottom:1px solid var(--line)}
tr:last-child td{border:0}
td.r{color:var(--steel);width:34px;padding-right:0}
td.hi{font-weight:700}
.msg{padding:18px;color:var(--steel)}
form{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:18px;display:grid;gap:14px;margin-bottom:40px}
label{display:grid;gap:4px;font-size:14px;color:var(--steel)}
input,select{font:inherit;padding:10px;border:1px solid var(--line);border-radius:4px;background:var(--ice);color:var(--navy)}
.pick{display:flex;gap:8px}.pick select{flex:1;min-width:0}
.pick button,.pr button{font:600 16px "Barlow Condensed",sans-serif;padding:8px 14px;border:1px solid var(--line);background:var(--card);color:var(--navy);border-radius:4px;cursor:pointer}
.pr{display:grid;grid-template-columns:1fr 64px 64px 36px;gap:8px;align-items:end;padding:8px 0;border-bottom:1px solid var(--line)}
.pr span{align-self:center;font-weight:500}.pr input{width:100%}
.go{background:var(--red);color:#fff;border:0;padding:12px;border-radius:4px;font:700 20px "Barlow Condensed",sans-serif;cursor:pointer}
#aundo{align-self:start;font:600 15px "Barlow Condensed",sans-serif;padding:6px 12px;border:1px solid var(--line);background:var(--card);color:var(--steel);border-radius:4px;cursor:pointer}
</style>
</head>
<body>
<header>
  <h1 id="title">SR Hockey Stats<i></i></h1>
  <nav id="nav"></nav>
</header>
<main>
  <div class="bar"><span id="info"></span><span><span id="updated"></span> <button id="refresh">Refresh</button></span></div>
  <div id="view"></div>
</main>
 
<script>
/* ===== SETUP ===== */
const SHEET_ID = "1_lz0PsbBTwZwcaWgzQeTMRQ1fh1DuN0wUhqhFtib-9g";
const REFRESH_MINUTES = 3;
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbymhT6I61xZ017LySUqP3cXSveH5pCvckZZhWnKn6MpctnlMcp_IK9_4USTepp9UnHL-g/exec";
/* Tab names below must match your sheet's tab names exactly. */
const TABS = [
  {id:"last",   label:"Last game",  sheet:"Last game"},
  {id:"season", label:"Season",     sheet:"Current season"},
  {id:"all",    label:"All time",   sheet:"All time"},
  {id:"add",    label:"Add game",   sheet:null}
];
const QUARTERS = [];  // newest first: 2026 Q3 back to 2022 Q3
for(let y=2026;y>=2022;y--) for(let q=4;q>=1;q--){
  if((y===2026&&q>3)||(y===2022&&q<3)) continue;
  QUARTERS.push(y+" Q"+q);
}
/* ================= */
 
const COLS_FULL=[["name","Player"],["gp","GP"],["goals","G"],["assists","A"],["points","PTS"],["ppg","P/G"],["gpg","G/G"],["apg","A/G"]];
const COLS_GAME=[["name","Player"],["goals","G"],["assists","A"],["points","PTS"]];
const KEYMAP={name:"name",gamesplayed:"gp",goals:"goals",assists:"assists",points:"points",pointspergame:"ppg",goalspergame:"gpg",assistspergame:"apg"};
 
const view=document.getElementById("view"),nav=document.getElementById("nav");
let current="last", quarter=QUARTERS[0], sort={key:"points",dir:-1}, cache={};
 
function parseCsv(text){
  const rows=[];let r=[],c="",q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){ if(ch=='"'){ if(text[i+1]=='"'){c+='"';i++} else q=false } else c+=ch }
    else if(ch=='"') q=true;
    else if(ch==","){r.push(c);c=""}
    else if(ch=="\n"){r.push(c);rows.push(r);r=[];c=""}
    else if(ch!="\r") c+=ch;
  }
  if(c||r.length){r.push(c);rows.push(r)}
  return rows;
}
function toTable(rows,keys){
  const players=[];
  for(const r of rows){
    const name=(r[0]||"").trim(),low=name.toLowerCase();
    if(!name||low==="name"||low.endsWith(":")||low.startsWith("season dates")||low.startsWith("game date")) continue;
    const o={name};
    keys.forEach((k,i)=>{if(i>0){const n=parseFloat(r[i]);o[k]=isNaN(n)?null:n}});
    if(!o.gp&&!o.points&&!o.goals&&!o.assists) continue;
    players.push(o);
  }
  return players;
}
async function fetchSheet(name,mode){
  const base=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&headers=0&sheet=${encodeURIComponent(name)}`;
  const bust="&_="+Date.now(),opt={cache:"no-store"};
  const wantMeta=mode==="last"||mode==="season";
  const [main,meta]=await Promise.all([fetch(base+(mode==="last"?"&range=A3:D100":"")+bust,opt),wantMeta?fetch(base+"&range=B1:B1"+bust,opt):null]);
  if(!main.ok) throw new Error("http "+main.status);
  const keys=mode==="last"?["name","goals","assists","points"]:["name","gp","goals","assists","points","ppg","gpg","apg"];
  let m="";
  if(meta&&meta.ok){const c=parseCsv(await meta.text()).flat().map(x=>x.trim()).filter(Boolean);m=c[c.length-1]||""}
  const txt=await main.text(),rows=parseCsv(txt);
  return {meta:m,players:toTable(rows,keys),dbg:`v3 | ${rows.length} rows received | first: ${txt.slice(0,90).replace(/\n/g," / ")}`};
}
 
function sheetName(){return current==="quarter"?quarter:TABS.find(t=>t.id===current).sheet}
const fmt=(v,k)=>v===null||v===undefined?"–":(["ppg","gpg","apg"].includes(k)?v.toFixed(2):v);
 
function draw(){
  const d=cache[sheetName()]; if(!d) return;
  const cols=current==="last"?COLS_GAME:COLS_FULL;
  if(!cols.some(c=>c[0]===sort.key)) sort={key:"points",dir:-1};
  const list=[...d.players].sort((a,b)=>{
    if(sort.key==="name") return sort.dir*a.name.localeCompare(b.name);
    const x=a[sort.key],y=b[sort.key];
    if(x===null||x===undefined) return 1; if(y===null||y===undefined) return -1;
    return sort.dir*(x-y)||(b.points-a.points)||a.name.localeCompare(b.name);
  });
  document.getElementById("info").textContent=
    current==="last"?(d.meta?"Game on "+d.meta:""):current==="season"?(d.meta?"Season "+d.meta:""):current==="quarter"?quarter:"Career totals";
  if(!list.length){view.innerHTML=`<div class="wrap"><p class="msg">No stats recorded here yet.</p><p class="msg" style="font-size:12px;padding-top:0">${esc(d.dbg||"")}</p></div>`;return}
  const head=cols.map(([k,l])=>`<th data-k="${k}" ${sort.key===k?`aria-sort="${sort.dir<0?"descending":"ascending"}"`:""}>${l}</th>`).join("");
  const body=list.map((p,i)=>`<tr>${cols.map(([k],j)=>j===0?`<td><span class="r">${i+1}</span>&nbsp; ${esc(p.name)}</td>`:`<td class="${k==="points"?"hi":""}">${fmt(p[k],k)}</td>`).join("")}</tr>`).join("");
  view.innerHTML=`<div class="wrap"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
  view.querySelectorAll("th").forEach(th=>th.onclick=()=>{
    const k=th.dataset.k; sort=sort.key===k?{key:k,dir:-sort.dir}:{key:k,dir:k==="name"?1:-1}; draw();
  });
}
const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
 
async function load(force){
  if(current==="add") return;
  const name=sheetName();
  if(!cache[name]) view.innerHTML='<div class="wrap"><p class="msg">Loading…</p></div>';
  try{
    if(force||!cache[name]||Date.now()-cache[name].at>REFRESH_MINUTES*60000){
      const t=await fetchSheet(name,current); t.at=Date.now(); cache[name]=t;
    }
    document.getElementById("updated").textContent="Updated "+new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit"});
    draw();
  }catch(e){
    if(!cache[name]) view.innerHTML='<div class="wrap"><p class="msg">Couldn\'t load this tab. Check that the sheet is shared as "Anyone with the link can view" and the tab name matches.</p></div>';
  }
}
function buildNav(){
  nav.innerHTML=TABS.map(t=>`<button data-t="${t.id}" aria-selected="${current===t.id}">${t.label}</button>`).join("")+
    `<select id="q" aria-label="Quarter" aria-selected="${current==="quarter"}">${QUARTERS.map(q=>`<option ${q===quarter&&current==="quarter"?"selected":""}>${q}</option>`).join("")}</select>`;
  nav.querySelectorAll("button").forEach(b=>b.onclick=()=>{current=b.dataset.t;buildNav();current==="add"?renderAdd():load()});
  const s=document.getElementById("q");
  s.onchange=()=>{current="quarter";quarter=s.value;buildNav();load()};
}
let roster=[];
async function renderAdd(){
  document.getElementById("info").textContent="Enter a game";
  document.getElementById("updated").textContent="";
  view.innerHTML='<div class="wrap"><p class="msg">Loading…</p></div>';
  try{ if(!cache["All time"]){const t=await fetchSheet("All time","all");t.at=Date.now();cache["All time"]=t} }
  catch(e){view.innerHTML='<div class="wrap"><p class="msg">Couldn\'t load the player list.</p></div>';return}
  const names=cache["All time"].players.map(p=>p.name).sort((a,b)=>a.localeCompare(b));
  view.innerHTML=`<form id="af">
    <label>Game date<input type="date" id="ad" required value="${new Date().toLocaleDateString("en-CA")}"></label>
    <label>Captain passcode<input type="password" id="ap" name="captain-code" autocomplete="new-password" autocapitalize="off" autocorrect="off" spellcheck="false"></label>
    <div class="pick"><select id="an" aria-label="Player"><option value="">Choose a player</option>${names.map(n=>`<option>${esc(n)}</option>`).join("")}</select><button type="button" id="aadd">Add player</button></div>
    <div id="ar"></div>
    <button class="go">Save to Last game tab</button>
    <div class="msg" id="as" role="status" style="padding:0"></div><button type="button" id="aundo">Undo last saved game</button></form>`;
  const rows=document.getElementById("ar"),st=document.getElementById("as");
  const drawRows=()=>{rows.innerHTML=roster.map((p,i)=>`<div class="pr"><span>${esc(p.name)}</span><label>G<input type="number" inputmode="numeric" min="0" max="99" data-i="${i}" data-f="goals" value="${p.goals}"></label><label>A<input type="number" inputmode="numeric" min="0" max="99" data-i="${i}" data-f="assists" value="${p.assists}"></label><button type="button" data-rm="${i}" aria-label="Remove ${esc(p.name)}">✕</button></div>`).join("")};
  drawRows();
  document.getElementById("aadd").onclick=()=>{
    const sel=document.getElementById("an"),n=sel.value;
    if(!n) return;
    if(roster.some(p=>p.name===n)){st.textContent=n+" is already added.";return}
    roster.push({name:n,goals:0,assists:0});sel.value="";st.textContent="";drawRows();
  };
  rows.oninput=e=>{const t=e.target;if(t.dataset.f) roster[t.dataset.i][t.dataset.f]=Math.max(0,Math.min(99,parseInt(t.value,10)||0))};
  rows.onclick=e=>{const i=e.target.dataset.rm;if(i!==undefined){roster.splice(i,1);drawRows()}};
  document.getElementById("af").onsubmit=async e=>{
    e.preventDefault();
    if(SCRIPT_URL.includes("PASTE")){st.textContent="The form isn't connected to your sheet yet (SCRIPT_URL).";return}
    if(!roster.length){st.textContent="Add at least one player.";return}
    const date=document.getElementById("ad").value;
    if(!confirm(`Add ${roster.length} players' stats for ${date} to the Current season and All time totals?`)) return;
    st.textContent="Saving…";
    const r=await send({date,players:roster});
    if(r==="ok"){st.textContent="Saved. Added to Last game, Current season and All time.";roster=[];drawRows();for(const k of ["Last game","Current season","All time"]) delete cache[k]}
    else st.textContent=r;
  };
  document.getElementById("aundo").onclick=async()=>{
    if(!confirm("Undo the most recently added game? This subtracts it from Current season and All time.")) return;
    st.textContent="Undoing…";
    const r=await send({action:"undo"});
    st.textContent=r.startsWith("undone")?"Undone. The game on "+r.slice(7)+" was removed from the totals.":r;
    delete cache["Current season"];delete cache["All time"];
  };
  async function send(extra){
    try{
      const res=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify({passcode:document.getElementById("ap").value.trim(),...extra})});
      const t=(await res.text()).trim();
      if(/^<(!doctype|html)/i.test(t)) return "Google sent back an error page instead of an answer. Nothing may have been saved, so check the Game log tab in your sheet before trying again.";
      return t||"Something went wrong.";
    }catch(err){return "Couldn't confirm the result. Check the Current season tab in your sheet before trying again."}
  }
}
document.getElementById("refresh").onclick=()=>load(true);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)load()});
setInterval(()=>{if(!document.hidden)load(true)},REFRESH_MINUTES*60000);
buildNav(); load();
</script>
</body>
</html>
